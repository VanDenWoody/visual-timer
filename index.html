<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Timer</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="titlebar"></div>
    <div class="corner-group">
      <button id="pop-out" class="corner-button pop-out" type="button" title="Pop out: always on top" aria-label="Pop out">
        <svg class="glyph pip-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect class="solid" x="12" y="11" width="6" height="5" rx="1"></rect></svg>
        <svg class="glyph full-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M14 14 10 10M10 14v-4h4"></path></svg>
      </button>
      <button id="sound-button" class="corner-button" type="button" title="Alarm sound" aria-label="Alarm sound">
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
      </button>
    </div>
    <p class="popped-note">The timer is in the picture-in-picture window. Close that window to bring it back.</p>
    <main id="stage">
      <button id="restart" class="corner-button restart" type="button" title="Restart" aria-label="Restart" hidden>
        <svg class="glyph solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.7 10h2.1A6 6 0 1 0 12 6v3L7 5l5-4z"></path></svg>
      </button>
      <svg id="dial" viewBox="0 0 240 240" preserveAspectRatio="xMidYMid meet" aria-label="Timer dial">
        <g id="face"></g>
        <path id="planned" class="planned" d=""></path>
        <path id="time-left" class="time-left" d=""></path>
        <path id="overtime" class="overtime" d=""></path>
        <g id="centre" role="button" tabindex="0" aria-label="Start">
          <circle class="centre-bg" cx="120" cy="120" r="24"></circle>
          <path id="icon-play" class="icon" d="M 113 108 L 133 120 L 113 132 Z"></path>
          <g id="icon-pause" class="icon" hidden>
            <rect x="110" y="109" width="7" height="22"></rect>
            <rect x="123" y="109" width="7" height="22"></rect>
          </g>
          <text id="centre-label" class="centre-label" x="120" y="120" hidden></text>
        </g>
      </svg>
    </main>
    <dialog id="sound-dialog" class="sound-dialog" aria-labelledby="sound-title">
      <div class="sound-panel">
        <header>
          <h2 id="sound-title">Alarm sound</h2>
          <button id="sound-close" class="close" type="button" aria-label="Close">×</button>
        </header>
        <div class="volume">
          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="100" step="5" />
          <output id="volume-value" for="volume"></output>
        </div>
        <section class="custom" aria-labelledby="custom-title">
          <h3 id="custom-title">Your own sound</h3>
          <div id="custom-row" class="sound-row" hidden>
            <label><input id="custom-radio" type="radio" name="sound" value="custom" /> <span id="custom-name"></span></label>
            <button id="custom-play" class="play" type="button" title="Play your sound" aria-label="Play your sound">▶</button>
          </div>
          <p id="custom-none" class="hint">Upload an audio file from your computer.</p>
          <div class="custom-actions">
            <button id="upload" type="button">Choose file…</button>
            <button id="remove-custom" type="button" hidden>Remove</button>
          </div>
          <input id="file-input" type="file" accept="audio/*" hidden />
          <p id="custom-message" class="message" role="alert" hidden></p>
          <p class="hint">The file stays in this browser. It is not uploaded anywhere.</p>
        </section>
        <div id="sound-list" role="radiogroup" aria-labelledby="sound-title"></div>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
