# Builds the Windows installer and attaches it to a draft GitHub release
# whenever a version tag (v1.2.3) is pushed. Publish the draft by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Visual Timer ${{ github.ref_name }}
          releaseBody: Download the `*-setup.exe` below and run it. Windows may show a SmartScreen warning because the installer is not signed; choose More info → Run anyway.
          releaseDraft: true
          prerelease: false
